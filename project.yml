name: CodexUsageStatus
options:
  bundleIdPrefix: com.sim
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CodexUsageStatus:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - CodexUsageStatus.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sim.CodexUsageStatus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Codex Usage Status
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
        CODE_SIGN_ENTITLEMENTS: Resources/CodexUsageStatus.entitlements
        ENABLE_APP_SANDBOX: NO
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - CodexUsageStatusTests
  CodexUsageStatusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: CodexUsageStatus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sim.CodexUsageStatusTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
